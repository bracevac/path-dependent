name = "path-dependent"
version = "0.1.0"
srcDir = "lean"
defaultTargets = ["LambdaP", "LambdaPFC", "LambdaPCC", "LambdaPFCI", "LambdaPCCI", "DOT", "FCsub", "DotToFCsub", "DotFC", "ManySortedFC"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = true
relaxedAutoImplicit = true

[[lean_lib]]
name = "LambdaP"

[[lean_lib]]
name = "LambdaPFC"

[[lean_lib]]
name = "LambdaPCC"

[[lean_lib]]
name = "LambdaPFCI"

[[lean_lib]]
name = "LambdaPCCI"

[[lean_lib]]
name = "DotFC"
roots = ["Coercions.All"]

[[lean_lib]]
name = "DOT"
roots = ["Coercions.DOT.Acyclic"]

[[lean_lib]]
name = "FCsub"
roots = ["Coercions.FCsub"]

[[lean_lib]]
name = "DotToFCsub"
roots = ["Coercions.Translation"]

[[lean_lib]]
name = "ManySortedFC"
roots = ["Coercions.ManySortedFC"]
