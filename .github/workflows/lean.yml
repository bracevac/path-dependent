name: Lean proofs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: 1
        with:
          auto-config: false
          build: true

  frontends:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        env:
          LEAN_NUM_THREADS: 1
        with:
          auto-config: false
          build: false
      - run: lake build Frontend CapturesFrontend CapturesCCFrontend ClassifiersFrontend PathsFrontend Oopsla16Frontend PDotFrontend PDotScalaRead PDotScala
      # One corpus module per step. A lean process that decides a corpus in the kernel peaks at 10.6 GB (vanilla)
      # or 7.1 GB (pDOT), measured cold. Two at once exceed the 16 GB of the runner, which kills the step with
      # exit code 143 (runs 40910837156 and 40909849834 on 2026-10-29).
      - run: lake build ScalaCorpusVanilla
      - run: lake build ScalaCorpusPDot
      - uses: coursier/setup-action@648df969f41ef15fda2baba8b37f9fa3d16390a3  # v3.0.4
        with:
          jvm: temurin:17
          apps: scalac:3.8.4
      - run: scalac -version 2>&1 | grep -F 'Scala compiler version 3.8.4'
      - run: lake env lean --run scripts/scala/Agree.lean vanilla scala/vanilla
      - run: git diff --exit-code scala/vanilla/TABLE.md
      - run: lake env lean --run scripts/scala/Agree.lean pdot scala/pdot
      - run: git diff --exit-code scala/pdot/TABLE.md
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scala-tables
          path: scala/*/TABLE.md
